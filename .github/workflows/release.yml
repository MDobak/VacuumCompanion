name: Release

# Runs only for version tags, for example v1.2.3.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Without a fixed key, each run signs with a new debug key and the APK cannot update an earlier install.
      - name: Use the debug key from secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "VacuumCompanion-$VERSION.apk"
      - run: gh release create "$GITHUB_REF_NAME" VacuumCompanion-*.apk --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
